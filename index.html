<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Paintbrush - Sans titre</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 8px;
      background-color: #008080;
      font-family: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 12px;
      color: #000;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Bordures 3D Windows 3.1 / 95 */
    .win-outset {
      background-color: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    }

    .win-inset {
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0 #404040, inset -1px -1px 0 #dfdfdf;
    }

    .win-window {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Barre de titre */
    .title-bar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
      font-weight: bold;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.3px;
    }

    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .title-controls {
      display: flex;
      gap: 2px;
    }

    .title-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      color: #000;
      font-size: 10px;
      line-height: 10px;
      text-align: center;
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #404040;
      border-bottom: 1px solid #404040;
      font-weight: bold;
    }

    /* Barre de menus */
    .menu-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 2px 4px;
      background: #c0c0c0;
      border-bottom: 1px solid #808080;
    }

    .menu-btn {
      background: #c0c0c0;
      border: 1px solid transparent;
      padding: 2px 7px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .menu-btn:hover {
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #808080;
      border-bottom: 1px solid #808080;
    }

    .menu-btn:active {
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-right: 1px solid #fff;
      border-bottom: 1px solid #fff;
    }

    /* Zone de travail principale */
    .workspace {
      display: flex;
      flex: 1;
      padding: 4px;
      gap: 6px;
      overflow: hidden;
    }

    /* Boîte à outils gauche */
    .toolbox {
      width: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 26px);
      gap: 2px;
    }

    .tool-btn {
      width: 26px;
      height: 26px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      font-size: 13px;
    }

    .tool-btn.active {
      background: #e0e0e0;
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .size-box {
      width: 54px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: #c0c0c0;
    }

    .size-option {
      width: 44px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .size-option.active {
      background: #000080;
    }

    .size-option.active .size-line {
      background: #ffffff;
    }

    .size-line {
      width: 34px;
      background: #000000;
    }

    /* Zone du Canvas */
    .canvas-container {
      flex: 1;
      background: #808080;
      overflow: auto;
      padding: 6px;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .canvas-wrapper {
      position: relative;
      background: #ffffff;
      box-shadow: 2px 2px 0 #404040;
      line-height: 0;
    }

    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    #previewCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* Palette de couleurs en bas */
    .palette-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      background: #c0c0c0;
      border-top: 1px solid #ffffff;
    }

    .active-colors {
      width: 32px;
      height: 32px;
      position: relative;
      background: #dfdfdf;
      flex-shrink: 0;
    }

    .bg-swatch {
      width: 16px;
      height: 16px;
      position: absolute;
      bottom: 3px;
      right: 3px;
      border: 1px solid #808080;
      background: #ffffff;
    }

    .fg-swatch {
      width: 16px;
      height: 16px;
      position: absolute;
      top: 3px;
      left: 3px;
      border: 1px solid #808080;
      background: #000000;
    }

    .swatches-grid {
      display: grid;
      grid-template-columns: repeat(14, 16px);
      grid-template-rows: repeat(2, 16px);
      gap: 2px;
    }

    .swatch {
      width: 16px;
      height: 16px;
      cursor: pointer;
      border-top: 1px solid #404040;
      border-left: 1px solid #404040;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
    }

    /* Barre d'état */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      gap: 6px;
      background: #c0c0c0;
      border-top: 1px solid #808080;
      font-size: 11px;
    }

    .status-panel {
      padding: 2px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #808080;
      margin-right: 4px;
    }

    .sync-dot.online { background: #00a000; }
    .sync-dot.saving { background: #d08000; }
    .sync-dot.error  { background: #d00000; }

    @media (max-width: 640px) {
      body { padding: 2px; }
      .swatches-grid {
        grid-template-columns: repeat(7, 18px);
        grid-template-rows: repeat(4, 18px);
      }
      .swatch { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>
  <div class="win-window win-outset">
    <!-- Barre de titre -->
    <div class="title-bar">
      <div class="title-bar-left">
        <span>🎨</span>
        <span>Paintbrush - Toile Partagée en Direct</span>
      </div>
      <div class="title-controls">
        <div class="title-btn">_</div>
        <div class="title-btn">□</div>
        <div class="title-btn">×</div>
      </div>
    </div>

    <!-- Barre d'actions rapides -->
    <div class="menu-bar">
      <button class="menu-btn" id="btnUndo" title="Annuler mon dernier trait (Ctrl+Z)">↩ Annuler</button>
      <button class="menu-btn" id="btnClear" title="Effacer toute la toile partagée">📄 Nouveau (Tout effacer)</button>
      <button class="menu-btn" id="btnDownload" title="Enregistrer l'image sur votre appareil">💾 Enregistrer PNG</button>
      <button class="menu-btn" id="btnSyncNow" title="Forcer l'envoi vers le serveur">🔄 Synchroniser</button>
    </div>

    <!-- Zone centrale -->
    <div class="workspace">
      <div class="toolbox">
        <div class="tools-grid" id="toolsGrid">
          <button class="tool-btn active" data-tool="pencil" title="Crayon">✏️</button>
          <button class="tool-btn" data-tool="brush" title="Pinceau">🖌️</button>
          <button class="tool-btn" data-tool="spray" title="Aérosol">💨</button>
          <button class="tool-btn" data-tool="fill" title="Pot de peinture (Remplissage)">🪣</button>
          <button class="tool-btn" data-tool="eraser" title="Gomme (Clic droit = couleur secondaire)">🧽</button>
          <button class="tool-btn" data-tool="picker" title="Pipette">💉</button>
          <button class="tool-btn" data-tool="line" title="Ligne droite">╱</button>
          <button class="tool-btn" data-tool="rect" title="Rectangle">▭</button>
          <button class="tool-btn" data-tool="ellipse" title="Ellipse / Cercle">◯</button>
          <button class="tool-btn" data-tool="text" title="Texte">A</button>
        </div>

        <div class="size-box win-inset" id="sizeBox" title="Épaisseur du trait">
          <div class="size-option active" data-size="2"><div class="size-line" style="height:2px"></div></div>
          <div class="size-option" data-size="5"><div class="size-line" style="height:5px"></div></div>
          <div class="size-option" data-size="10"><div class="size-line" style="height:9px"></div></div>
          <div class="size-option" data-size="18"><div class="size-line" style="height:12px"></div></div>
        </div>
      </div>

      <div class="canvas-container win-inset">
        <div class="canvas-wrapper">
          <canvas id="mainCanvas" width="800" height="520"></canvas>
          <canvas id="previewCanvas" width="800" height="520"></canvas>
        </div>
      </div>
    </div>

    <!-- Palette de couleurs -->
    <div class="palette-bar">
      <div class="active-colors win-inset" title="Clic gauche : couleur principale | Clic droit : arrière-plan">
        <div class="bg-swatch" id="bgSwatch"></div>
        <div class="fg-swatch" id="fgSwatch"></div>
      </div>
      <div class="swatches-grid" id="swatchesGrid"></div>
    </div>

    <!-- Barre d'état -->
    <div class="status-bar">
      <div class="status-panel win-inset" style="flex:1" id="statusText">
        Prêt. Clic gauche = couleur 1, Clic droit = couleur 2.
      </div>
      <div class="status-panel win-inset" style="width:105px" id="coordsText">0, 0 px</div>
      <div class="status-panel win-inset" style="width:190px">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">Connexion Firebase...</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    // Votre configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDIaO-l7a9hh7gFFs66VxtKq3jBs2gDr8c",
      authDomain: "paintbrush-15152.firebaseapp.com",
      databaseURL: "https://paintbrush-15152-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "paintbrush-15152",
      storageBucket: "paintbrush-15152.firebasestorage.app",
      messagingSenderId: "172480851575",
      appId: "1:172480851575:web:53f84c17b487ddac482072"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const canvasRef = ref(db, "shared_canvas/current");

    // Identifiant unique de cet onglet pour éviter de réécraser son propre dessin en cours
    const clientId = "user_" + Math.random().toString(36).slice(2, 10);

    // Palette 28 couleurs classique Windows 3.1 / 95
    const PALETTE = [
      "#000000", "#808080", "#800000", "#808000", "#008000", "#008080", "#000080",
      "#800080", "#808040", "#004040", "#0080ff", "#004080", "#4000ff", "#804000",
      "#ffffff", "#c0c0c0", "#ff0000", "#ffff00", "#00ff00", "#00ffff", "#0000ff",
      "#ff00ff", "#ffff80", "#00ff80", "#80ffff", "#8080ff", "#ff0080", "#ff8040"
    ];

    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d", { willReadFrequently: true });
    const previewCanvas = document.getElementById("previewCanvas");
    const pCtx = previewCanvas.getContext("2d");

    const fgSwatch = document.getElementById("fgSwatch");
    const bgSwatch = document.getElementById("bgSwatch");
    const coordsText = document.getElementById("coordsText");
    const statusText = document.getElementById("statusText");
    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");

    let currentTool = "pencil";
    let brushSize = 2;
    let fgColor = "#000000";
    let bgColor = "#ffffff";
    let isDrawing = false;
    let activeColor = "#000000";
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let undoStack = [];
    let lastReceivedTimestamp = 0;
    let saveTimeout = null;

    // Initialisation toile blanche
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

    function setSyncState(state, label) {
      syncDot.className = "sync-dot " + state;
      syncText.textContent = label;
    }

    function pushUndo() {
      if (undoStack.length >= 15) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
    }

    // Sauvegarde vers Firebase Realtime Database
    function scheduleSaveToFirebase(immediate = false) {
      clearTimeout(saveTimeout);
      const delay = immediate ? 50 : 400;
      setSyncState("saving", "Envoi du dessin...");
      saveTimeout = setTimeout(async () => {
        try {
          const dataUrl = mainCanvas.toDataURL("image/webp", 0.85);
          const now = Date.now();
          lastReceivedTimestamp = now;
          await set(canvasRef, {
            image: dataUrl,
            updatedBy: clientId,
            updatedAt: now
          });
          setSyncState("online", "Synchronisé en direct");
        } catch (err) {
          console.error(err);
          setSyncState("error", "Erreur règles Firebase");
          statusText.textContent = "Erreur Firebase : vérifiez que .read et .write sont à true.";
        }
      }, delay);
    }

    // Écoute des modifications des autres visiteurs en temps réel
    onValue(canvasRef, (snapshot) => {
      const data = snapshot.val();
      setSyncState("online", "Connecté en direct");
      if (!data || !data.image) return;
      if (data.updatedBy === clientId && data.updatedAt === lastReceivedTimestamp) return;
      if (isDrawing) return;

      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        ctx.drawImage(img, 0, 0);
        statusText.textContent = "Toile mise à jour par un visiteur.";
      };
      img.src = data.image;
    }, (error) => {
      console.error(error);
      setSyncState("error", "Accès refusé");
    });

    // Construction de la palette
    const swatchesGrid = document.getElementById("swatchesGrid");
    PALETTE.forEach((hex) => {
      const div = document.createElement("div");
      div.className = "swatch";
      div.style.backgroundColor = hex;
      div.addEventListener("mousedown", (e) => {
        e.preventDefault();
        if (e.button === 2) {
          bgColor = hex;
          bgSwatch.style.backgroundColor = hex;
        } else {
          fgColor = hex;
          fgSwatch.style.backgroundColor = hex;
        }
      });
      div.addEventListener("contextmenu", (e) => e.preventDefault());
      swatchesGrid.appendChild(div);
    });

    // Sélection des outils
    document.querySelectorAll(".tool-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tool-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTool = btn.dataset.tool;
        statusText.textContent = "Outil : " + btn.title;
      });
    });

    // Sélection de l'épaisseur
    document.querySelectorAll(".size-option").forEach((opt) => {
      opt.addEventListener("click", () => {
        document.querySelectorAll(".size-option").forEach((o) => o.classList.remove("active"));
        opt.classList.add("active");
        brushSize = parseInt(opt.dataset.size, 10);
      });
    });

    function getCoords(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: Math.floor(clientX - rect.left),
        y: Math.floor(clientY - rect.top)
      };
    }

    function hexToRgba(hex) {
      const clean = hex.replace("#", "");
      return [
        parseInt(clean.substring(0, 2), 16),
        parseInt(clean.substring(2, 4), 16),
        parseInt(clean.substring(4, 6), 16),
        255
      ];
    }

    function floodFill(startX, startY, fillHex) {
      if (startX < 0 || startY < 0 || startX >= mainCanvas.width || startY >= mainCanvas.height) return;
      const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
      const data = imgData.data;
      const width = mainCanvas.width;
      const height = mainCanvas.height;

      const idx = (startY * width + startX) * 4;
      const targetR = data[idx], targetG = data[idx + 1], targetB = data[idx + 2];
      const [fillR, fillG, fillB] = hexToRgba(fillHex);

      if (targetR === fillR && targetG === fillG && targetB === fillB) return;

      const stack = [[startX, startY]];
      while (stack.length) {
        const [x, y] = stack.pop();
        const pos = (y * width + x) * 4;
        if (data[pos] === targetR && data[pos + 1] === targetG && data[pos + 2] === targetB) {
          data[pos] = fillR;
          data[pos + 1] = fillG;
          data[pos + 2] = fillB;
          data[pos + 3] = 255;

          if (x > 0) stack.push([x - 1, y]);
          if (x < width - 1) stack.push([x + 1, y]);
          if (y > 0) stack.push([x, y - 1]);
          if (y < height - 1) stack.push([x, y + 1]);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function drawLineSegment(targetCtx, x1, y1, x2, y2, color, width) {
      targetCtx.strokeStyle = color;
      targetCtx.lineWidth = width;
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";
      targetCtx.beginPath();
      targetCtx.moveTo(x1, y1);
      targetCtx.lineTo(x2, y2);
      targetCtx.stroke();
    }

    function startAction(e) {
      if (e.button === 2 && !e.touches) {
        activeColor = bgColor;
      } else {
        activeColor = fgColor;
      }

      const { x, y } = getCoords(e);
      startX = lastX = x;
      startY = lastY = y;

      if (currentTool === "picker") {
        const pixel = ctx.getImageData(x, y, 1, 1).data;
        const picked = "#" + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, "0")).join("");
        if (e.button === 2) {
          bgColor = picked;
          bgSwatch.style.backgroundColor = picked;
        } else {
          fgColor = picked;
          fgSwatch.style.backgroundColor = picked;
        }
        return;
      }

      pushUndo();

      if (currentTool === "fill") {
        floodFill(x, y, activeColor);
        scheduleSaveToFirebase();
        return;
      }

      if (currentTool === "text") {
        const txt = prompt("Texte à écrire sur la toile :");
        if (txt) {
          ctx.fillStyle = activeColor;
          ctx.font = `${Math.max(14, brushSize * 3)}px "MS Sans Serif", Arial, sans-serif`;
          ctx.fillText(txt, x, y);
          scheduleSaveToFirebase();
        }
        return;
      }

      isDrawing = true;

      if (currentTool === "pencil" || currentTool === "brush" || currentTool === "eraser") {
        const col = currentTool === "eraser" ? bgColor : activeColor;
        const size = currentTool === "pencil" ? 1 : (currentTool === "eraser" ? brushSize * 2.5 : brushSize);
        drawLineSegment(ctx, x, y, x + 0.1, y + 0.1, col, size);
      }
    }

    function moveAction(e) {
      const { x, y } = getCoords(e);
      coordsText.textContent = `${x}, ${y} px`;
      if (!isDrawing) return;

      if (currentTool === "pencil" || currentTool === "brush" || currentTool === "eraser") {
        const col = currentTool === "eraser" ? bgColor : activeColor;
        const size = currentTool === "pencil" ? 1 : (currentTool === "eraser" ? brushSize * 2.5 : brushSize);
        drawLineSegment(ctx, lastX, lastY, x, y, col, size);
        lastX = x;
        lastY = y;
      } else if (currentTool === "spray") {
        ctx.fillStyle = activeColor;
        const radius = brushSize * 3;
        for (let i = 0; i < 20; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * radius;
          ctx.fillRect(x + Math.cos(angle) * r, y + Math.sin(angle) * r, 1, 1);
        }
      } else if (currentTool === "line" || currentTool === "rect" || currentTool === "ellipse") {
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        pCtx.strokeStyle = activeColor;
        pCtx.lineWidth = brushSize;
        pCtx.beginPath();
        if (currentTool === "line") {
          pCtx.moveTo(startX, startY);
          pCtx.lineTo(x, y);
        } else if (currentTool === "rect") {
          pCtx.strokeRect(startX, startY, x - startX, y - startY);
        } else if (currentTool === "ellipse") {
          const rx = Math.abs(x - startX) / 2;
          const ry = Math.abs(y - startY) / 2;
          const cx = Math.min(startX, x) + rx;
          const cy = Math.min(startY, y) + ry;
          pCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        }
        pCtx.stroke();
      }
    }

    function endAction(e) {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentTool === "line" || currentTool === "rect" || currentTool === "ellipse") {
        ctx.drawImage(previewCanvas, 0, 0);
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      }

      scheduleSaveToFirebase();
    }

    mainCanvas.addEventListener("mousedown", startAction);
    window.addEventListener("mousemove", moveAction);
    window.addEventListener("mouseup", endAction);
    mainCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

    mainCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); startAction(e); }, { passive: false });
    mainCanvas.addEventListener("touchmove", (e) => { e.preventDefault(); moveAction(e); }, { passive: false });
    mainCanvas.addEventListener("touchend", endAction);

    // Boutons de la barre d'actions
    document.getElementById("btnUndo").addEventListener("click", () => {
      if (!undoStack.length) return;
      ctx.putImageData(undoStack.pop(), 0, 0);
      scheduleSaveToFirebase();
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        e.preventDefault();
        document.getElementById("btnUndo").click();
      }
    });

    document.getElementById("btnClear").addEventListener("click", () => {
      if (!confirm("Effacer toute la toile partagée pour tous les visiteurs ?")) return;
      pushUndo();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      scheduleSaveToFirebase(true);
    });

    document.getElementById("btnDownload").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = "paintbrush-dessin.png";
      link.href = mainCanvas.toDataURL("image/png");
      link.click();
    });

    document.getElementById("btnSyncNow").addEventListener("click", () => {
      scheduleSaveToFirebase(true);
    });
  </script>
</body>
</html>
